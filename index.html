<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doctor Finder</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- Header -->

<header class="header">

<h2 class="logo">DocFinder</h2>

<input 
type="text" 
placeholder="Search doctors, hospitals..." 
class="search-bar">

</header>


<!-- Categories -->

<section class="categories">

<div class="category">Dentist</div>
<div class="category">Cardiologist</div>
<div class="category">Dermatologist</div>
<div class="category">Neurologist</div>
<div class="category">General</div>

</section>


<!-- Doctor List -->

<section class="doctor-list">

<h3>Popular Doctors Near You</h3>


<!-- Doctor Card 1 -->

<div class="doctor-card">

<img src="https://via.placeholder.com/120" alt="Doctor">

<div class="doctor-info">

<h4>Dr. Rahul Sharma</h4>

<p>Cardiologist • 10 yrs experience</p>

<p class="rating">⭐ 4.7</p>

<button onclick="bookDoctor()">Book Appointment</button>

</div>

</div>


<!-- Doctor Card 2 -->

<div class="doctor-card">

<img src="https://via.placeholder.com/120" alt="Doctor">

<div class="doctor-info">

<h4>Dr. Ananya Patel</h4>

<p>Dentist • 8 yrs experience</p>

<p class="rating">⭐ 4.5</p>

<button onclick="bookDoctor()">Book Appointment</button>

</div>

</div>


<!-- Doctor Card 3 -->

<div class="doctor-card">

<img src="https://via.placeholder.com/120" alt="Doctor">

<div class="doctor-info">

<h4>Dr. Kiran Kumar</h4>

<p>Dermatologist • 12 yrs experience</p>

<p class="rating">⭐ 4.8</p>

<button onclick="bookDoctor()">Book Appointment</button>

</div>

</div>


</section>

<script src="script.js"></script>

</body>

</html>
