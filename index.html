<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doctor App</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div>
      <h2>📍 Home</h2>
      <p>Kavuru, Andhra Pradesh</p>
    </div>
    <div class="gear" onclick="toggleSettings()">⚙️</div>

    <div class="settings" id="settings">
      <p>🔔 Notifications</p>
      <p>🌙 Dark Mode</p>
      <p>📍 Location</p>
      <p>🔒 Privacy</p>
      <hr>
      <p>🩺 Medical Records</p>
      <p>❓ Help</p>
      <hr>
      <p class="logout">Logout</p>
    </div>
  </div>

  <!-- SEARCH -->
  <input class="search" placeholder="Search doctors">

  <!-- BANNER -->
  <div class="banner">
    <h2>Find Best Doctors</h2>
    <p>Book appointments instantly</p>
    <button>Explore Now</button>
  </div>

  <!-- SPECIALITIES -->
  <div class="specialities">

    <div onclick="showDoctors('Dentist')">
      <img src="images/dentist.jpg">
      <p>Dentist</p>
    </div>

    <div onclick="showDoctors('Dermatologist')">
      <img src="images/dermatologist.jpg">
      <p>Dermatologist</p>
    </div>

    <div onclick="showDoctors('Cardiologist')">
      <img src="images/cardiologist.jpg">
      <p>Cardiologist</p>
    </div>

    <div onclick="showDoctors('Neurologist')">
      <img src="images/neurologist.jpg">
      <p>Neurologist</p>
    </div>

  </div>

  <!-- DOCTOR LIST -->
  <h3 id="title">Recommended Doctors</h3>
  <div id="doctorList"></div>

</div>

<!-- BOOKING MODAL -->
<div id="modal" style="display:none;">
  <div class="modal-box">
    <h3 id="docName"></h3>

    <label>Select Date</label>
    <input type="date" id="date">

    <label>Available Time Slots</label>
    <div id="slots"></div>

    <button onclick="confirmAppointment()">Confirm Appointment</button>
    <button class="cancel" onclick="closeModal()">Cancel</button>
  </div>
</div>

<div class="nav">
  <div>🏠</div>
  <div>🔍</div>
  <div>📅</div>
  <div>👤</div>
</div>

<!-- ✅ SUCCESS POPUP (CORRECT PLACE) -->
<div id="successPopup" style="display:none;">
  <div class="success-box">
    <div class="check">✔️</div>
    <h3>Appointment Confirmed</h3>
    <p id="successText"></p>
    <button onclick="closeSuccess()">Done</button>
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
